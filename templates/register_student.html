{% extends 'base.html' %}
{% block title %}Register person{% endblock %}
{% block content %}
<h4 class="mb-3">Register student / employee</h4>
<div class="row"><div class="col-lg-8"><div class="card p-4">
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Unique ID *</label><input class="form-control" name="student_code" value="{{ form.get('student_code','') }}" maxlength="30" required placeholder="e.g. CS-2023-001"></div>
    <div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="full_name" value="{{ form.get('full_name','') }}" maxlength="100" required></div>
    <div class="col-md-6"><label class="form-label">Department *</label><input class="form-control" name="department" list="deps" value="{{ form.get('department','') }}" maxlength="60" required>
      <datalist id="deps">{% for d in groups.departments %}<option value="{{ d }}">{% endfor %}</datalist></div>
    <div class="col-md-6"><label class="form-label">Class / semester / designation *</label><input class="form-control" name="class_name" list="cls" value="{{ form.get('class_name','') }}" maxlength="60" required>
      <datalist id="cls">{% for c in groups.classes %}<option value="{{ c }}">{% endfor %}</datalist></div>
    <div class="col-md-6"><label class="form-label">Email (optional)</label><input class="form-control" type="email" name="email" value="{{ form.get('email','') }}" maxlength="120"></div>
    <div class="col-md-6"><label class="form-label">Registration date</label><input class="form-control" value="Set automatically (today, {{ tz_name }})" disabled></div>
    <div class="col-12"><div class="border rounded p-3 bg-light">
      <div class="form-check"><input class="form-check-input" type="checkbox" name="consent" id="consent" {{ 'checked' if form.get('consent') }}>
        <label class="form-check-label" for="consent"><strong>Informed consent *</strong> - The person has been told that their face will be converted into a numeric template (their photos are <u>not</u> stored), that it is used only to record attendance, that they may request deletion at any time, and that a manual attendance alternative exists.</label></div></div></div>
  </div>
  <div class="mt-4 d-flex gap-2"><button class="btn btn-primary"><i class="bi bi-arrow-right-circle"></i> Save and continue to face capture</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('students.students') }}">Cancel</a></div>
</form></div></div></div>
{% endblock %}
