<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Face Attendance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card p-4">
    <div class="text-center mb-3"><i class="bi bi-person-bounding-box text-primary" style="font-size:2.6rem"></i>
      <h4 class="mt-2 mb-0">Face Attendance System</h4><div class="small-muted">Administrator sign in</div></div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, m in messages %}<div class="alert alert-{{ cat if cat in ('success','danger','warning','info') else 'secondary' }} py-2">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post" autocomplete="off" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username</label>
        <input class="form-control" name="username" maxlength="60" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" maxlength="128" required></div>
      <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
    </form>
    <p class="small-muted text-center mt-3 mb-0">Authorised administrators only. Face recognition is an aid, not proof of identity.</p>
  </div>
</div>
</body>
</html>
